# Render Blueprint — deploys ONLY the public API (backend/cmd/api).
# The admin API, admin panel, and bridge run on your machine, never here.
services:
  - type: web
    name: nightmm-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI          # from MongoDB Atlas — set in the Render dashboard
        sync: false
      - key: MONGO_DB
        value: videoscraper
      - key: JWT_SECRET         # any long random string
        generateValue: true
      - key: API_TOKEN          # must match the frontend's VITE_API_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS       # your Cloudflare Pages URL, e.g. https://nightmm.pages.dev
        sync: false
