# Copy to  config.ini  and fill in.  config.ini is git-ignored.

[telegram]
# from https://my.telegram.org  ->  API development tools
api_id   = 000000
api_hash = 0000000000000000000000000000000
# session file name (created on first run after you log in with your phone)
session  = tgadd
# optional: a Bot API token to also POST a notice somewhere (leave blank)

[streamwish]
# https://streamwish.com  ->  Account  ->  API
api_key   =
api_base  = https://api.streamwish.com/api
embed_host = https://embedwish.com

[vidhide]
# optional 2nd host (mirror). Leave api_key blank to skip.
api_key   =
api_base  = https://api.vidhide.com/api
embed_host = https://vidhide.com

[site]
# the ADMIN API (it also serves the public routes). Local only.
url            = http://localhost:8081
admin_password = admin123
api_token      = <your-API_TOKEN>

[bridge]
# local service the admin panel calls (via the backend proxy). 127.0.0.1 only.
host = 127.0.0.1
port = 9001
